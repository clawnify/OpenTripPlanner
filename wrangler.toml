name = "open-trip-planner"
main = "src/server/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "open-trip-planner-db"
database_id = "local"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "open-trip-planner-uploads"
